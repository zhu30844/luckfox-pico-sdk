# Build the firmware for every board in the matrix and, on a release tag,
# publish the bundles to the MotionSense repository.
#
# Trigger:  push a tag  motionsense-vX.Y.Z  to this repository (the SDK fork).
#           The MotionSense release is named vX.Y.Z and its tag is created on
#           the submodule commit this SDK commit points at.
#           workflow_dispatch builds without publishing, for trying changes.
#
# Secret:   MOTIONSENSE_RELEASE_TOKEN, a fine-grained token with
#           "Contents: read and write" on zhu30844/MotionSense only. Needed
#           because GITHUB_TOKEN cannot write to another repository.
#
# Runners:  build jobs run on the self-hosted runners in the "runner" VM on
#           the K12 (labels self-hosted,k12,<board>; one instance per board so
#           each keeps its own tree), unless workflow_dispatch picks "github".
#           Their workspace persists between runs, so a build is incremental:
#           no git clean, no actions/cache, the toolchain image from the local
#           Docker layer cache. A tag push builds from a clean tree (dl/ and
#           .buildroot-ccache kept); workflow_dispatch can ask for one too.
#           That VM is NAT-only and cannot reach the LAN, the tailnet or the
#           PVE host. publish always runs GitHub-hosted, so the release token
#           never reaches the K12.
#
# Environment: the build runs inside the image from .devcontainer/Dockerfile,
# so CI and a local container build are the same toolchain, Go and cmake.
#
# Caches (GitHub-hosted only): dl/ (buildroot tarballs, keyed on the
#           defconfigs) and .buildroot-ccache (keyed per board, restored from
#           the newest). Both resolve relative to the SDK root; see
#           motionsense_defconfig.
#
# Actions are pinned to commit SHAs; the comment names the release.

name: Release

on:
  push:
    tags: ['motionsense-v*']
  workflow_dispatch:
    inputs:
      runner:
        description: Where to build
        type: choice
        options: [k12, github]
        default: k12
      clean:
        description: "k12 only: wipe the build tree first (keeps dl/ and ccache)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: luckfox-pico-sdk-dev:ci
  # inputs.runner is empty on a tag push, which means k12
  HOSTED: ${{ inputs.runner == 'github' }}
  CLEAN: ${{ github.event_name == 'push' || inputs.clean }}

jobs:
  build:
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-latest' || fromJSON(format('["self-hosted","k12","{0}"]', matrix.runner)) }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # One line per board. `board` is the directory under project/cfg/,
        # which must hold exactly one BoardConfig*.mk; `slug` names the
        # bundle. Keep slug in step with slug_for() in
        # project/app/motionsense/scripts/mk-release.sh. `runner` is the
        # label of that board's self-hosted runner instance.
        include:
          - board: BoardConfig_MotionSense_Pro_Max
            slug: luckfox-pico-pro-max
            runner: promax
          - board: BoardConfig_MotionSense_Ultra
            slug: luckfox-pico-ultra
            runner: ultra
    steps:
      - name: Free disk space
        if: env.HOSTED == 'true'
        # buildroot's output tree is ~20 GB; the hosted runner has ~14 GB
        # free until the preinstalled SDKs we do not use are removed.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune -af >/dev/null
          df -h / | tail -1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1
          # Self-hosted keeps its tree for incremental builds; see CLEAN
          clean: ${{ env.HOSTED == 'true' }}

      - name: Clean build tree
        if: env.HOSTED != 'true' && env.CLEAN == 'true'
        run: |
          git clean -ffdxq -e /dl/ -e /.buildroot-ccache/
          git submodule foreach --quiet --recursive git clean -ffdxq
          df -h . | tail -1

      - name: Version
        id: ver
        run: |
          case "$GITHUB_REF" in
            refs/tags/motionsense-v*) v=${GITHUB_REF#refs/tags/motionsense-} ;;
            *) v=dev-$(git rev-parse --short HEAD) ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "go=$(sed -n 's/.*"GO_VERSION": *"\([^"]*\)".*/\1/p' .devcontainer/devcontainer.json)" >> "$GITHUB_OUTPUT"
          echo "app_sha=$(git rev-parse HEAD:project/app/motionsense)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: env.HOSTED == 'true'

      - name: Build toolchain image (GitHub-hosted, GHA layer cache)
        if: env.HOSTED == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .devcontainer
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            GO_VERSION=${{ steps.ver.outputs.go }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build toolchain image (self-hosted, local layer cache)
        if: env.HOSTED != 'true'
        run: |
          docker build -q -t "$IMAGE" --build-arg GO_VERSION=${{ steps.ver.outputs.go }} .devcontainer
          docker image prune -f >/dev/null

      - name: Cache buildroot downloads
        if: env.HOSTED == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: br-dl-${{ hashFiles('sysdrv/tools/board/buildroot/*_defconfig') }}
          restore-keys: br-dl-

      - name: Cache ccache
        if: env.HOSTED == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .buildroot-ccache
          key: br-ccache-${{ matrix.board }}-${{ github.sha }}
          restore-keys: br-ccache-${{ matrix.board }}-

      - name: Select board
        run: |
          set -e
          cfgs=(project/cfg/${{ matrix.board }}/BoardConfig*.mk)
          [ ${#cfgs[@]} -eq 1 ] || { echo "expected one BoardConfig*.mk in ${{ matrix.board }}, found ${#cfgs[@]}"; exit 1; }
          ln -rfs "${cfgs[0]}" .BoardConfig.mk
          echo "building $(readlink .BoardConfig.mk)"

      - name: Build firmware
        # Self-hosted: both boards build at once on one 12-vCPU / 8 GB VM
        env:
          JOBS: ${{ env.HOSTED == 'true' && '0' || '6' }}
        run: |
          [ "$JOBS" = 0 ] && JOBS=$(nproc)
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/sdk" -w /sdk \
            -e HOME=/tmp -e LF_JOBS="$JOBS" "$IMAGE" ./build.sh

      - name: Assemble release bundle
        # The self-hosted tree persists: drop earlier bundles so only this
        # run's is uploaded.
        run: |
          rm -rf output/release
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/sdk" -w /sdk -e HOME=/tmp "$IMAGE" \
            project/app/motionsense/scripts/mk-release.sh \
              --board "${{ matrix.board }}" --slug "${{ matrix.slug }}" \
              --version "${{ steps.ver.outputs.version }}" --out /sdk/output/release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.slug }}
          path: |
            output/release/*.zip
            output/release/*.zip.sha256
          if-no-files-found: error
          retention-days: 14

    outputs:
      version: ${{ steps.ver.outputs.version }}
      app_sha: ${{ steps.ver.outputs.app_sha }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/motionsense-v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.MOTIONSENSE_RELEASE_TOKEN }}
      VERSION: ${{ needs.build.outputs.version }}
      APP_SHA: ${{ needs.build.outputs.app_sha }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bundle-*
          merge-multiple: true
          path: bundles

      - name: Create release on zhu30844/MotionSense
        # Body and draft state follow the version and the app repository:
        #   docs/releases/<version>.md exists at APP_SHA -> that text, published
        #   else patch version (vX.Y.Z, Z>0)             -> generated notes, published
        #   else minor/major (vX.Y.0)                    -> generated notes, DRAFT
        # A draft creates no tag; GitHub places it on --target when published.
        run: |
          set -e
          ls -la bundles
          # With --generate-notes GitHub puts this text ABOVE the generated list,
          # so it has no leading rule; the notes-file path adds one itself.
          cat > footer.md <<FOOTER
          Built from zhu30844/luckfox-pico-sdk @ ${GITHUB_SHA} (tag \`${GITHUB_REF_NAME}\`),
          MotionSense @ ${APP_SHA}. Each zip holds the flashable \`update.img\`, the
          individual partitions, licences, and a SOURCES.md naming these revisions.
          FOOTER

          flags=()
          if gh api "repos/zhu30844/MotionSense/contents/docs/releases/${VERSION}.md?ref=${APP_SHA}" \
                -H 'Accept: application/vnd.github.raw' > notes.md 2>/dev/null; then
            echo "using docs/releases/${VERSION}.md"
            printf '\n---\n' >> notes.md
            cat footer.md >> notes.md
            flags+=(--notes-file notes.md)
          else
            echo "no docs/releases/${VERSION}.md; generating notes"
            flags+=(--generate-notes --notes-file footer.md)
            case "$VERSION" in
              v*.*.0) echo "minor/major without notes: creating a draft"; flags+=(--draft) ;;
            esac
          fi

          gh release create "$VERSION" bundles/* \
            --repo zhu30844/MotionSense --target "$APP_SHA" \
            --title "MotionSense $VERSION" "${flags[@]}"
